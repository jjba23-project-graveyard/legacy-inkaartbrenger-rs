[package]
name = "inkaartbrenger"
version = "0.1.9"
edition = "2024"
authors = ["Josep Bigorra <jjbigorra@gmail.com>"]
description = "Web crawling Sitemap generator written in Rust."
license = "AGPL-3.0-or-later"

[profile.dev]
incremental = true
opt-level = 1
debug = 2
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 3
debug = 1
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false

[profile.ci]
inherits = "dev"
opt-level = 0
debug = 0
incremental = false

[dependencies]
# For coloring terminal output
ansi_term = "0.12.1"
# Async runtime and utilities
tokio = { version = "1", features = ["full"] }
# Async HTTP client
reqwest = { version = "0.12", features = ["rustls-tls"] }
# HTML parsing with CSS selectors
scraper = "0.19.0"
# URL parsing and normalization
url = "2.5.2"
# Fast XML reading/writing
quick-xml = { version = "0.35", features = ["serialize"] }
# Command-line argument parsing
clap = { version = "4.5.8", features = ["derive"] }
# Terminal spinners and progress bars
indicatif = "0.17.8"
# Date-time
chrono = { version = "0.4", features = ["serde"] }
# Retries
tokio-retry2 = "0.6"
# Errors
anyhow = "1.0.100"
# Random
rand = "0.9.2"
# OpenSSL
openssl = { version = "0.10", features = ["vendored"] }